services:
  shop:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "${SHOP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/shop.db"
      Database__ApplyMigrationsOnStartup: "true"
      AdminEmail: "${ADMIN_EMAIL:-}"
      Store__Name: "${STORE_NAME:-ShopCoursework}"
      Store__CurrencyCode: "${STORE_CURRENCY_CODE:-RUB}"
      Store__Culture: "${STORE_CULTURE:-ru-RU}"
    volumes:
      - shop_data:/app/data
      - shop_uploads:/app/wwwroot/uploads
      - shop_keys:/home/app/.aspnet/DataProtection-Keys

volumes:
  shop_data:
  shop_uploads:
  shop_keys:
